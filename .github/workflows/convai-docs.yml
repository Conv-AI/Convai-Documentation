# Generated by the convai-docs plugin, version 3.1.2. Do not edit by hand:
# the tooling release regenerates this file.
name: Documentation checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  pages:
    name: Changed pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Lint the pages this pull request touches
        # Only the changed pages, so the check stays fast and every finding is about work in
        # this pull request rather than a backlog nobody here created.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF"...HEAD -- '*.md')
          FILES=$(echo "$CHANGED" | grep -vE '^[.]convai-docs/|^[.]cursor/|^[.]github/|^SUMMARY[.]md$|^AGENTS[.]md$|^CLAUDE[.]md$|^CODE_OF_CONDUCT[.]md$|^CONTRIBUTING[.]md$|^LICENSE[.]md$|^SECURITY[.]md$' || true)
          if [ -z "$FILES" ]; then
            echo "No documentation pages changed."
            exit 0
          fi
          echo "$FILES"
          python .convai-docs/rules/tools/check_page.py $FILES --summary SUMMARY.md

  site:
    name: Whole site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check links, page options, icons, redirects, and images
        # Baselined: findings that already existed when this check was adopted live in
        # .convai-docs/site-baseline.json and do not fail the build. Only new ones do.
        # Work the baseline down; never regenerate it to turn a red run green.
        # On a pull request, --base adds the checks about this change: alt text on the pages
        # it touches, the names of images it adds, and a redirect for every page it removes
        # or moves. A manual run has no base and checks the whole site only.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python .convai-docs/rules/tools/check_site.py . --baseline .convai-docs/site-baseline.json --base "origin/$BASE_REF"
          else
            python .convai-docs/rules/tools/check_site.py . --baseline .convai-docs/site-baseline.json
          fi
