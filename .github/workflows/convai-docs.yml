# Generated by convai-docs 2.2.1. Do not edit by hand.
# Re-run `python scripts/sync_agent_rules.py --out .` in convai-docs-tools to update.
name: Documentation checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  pages:
    name: Changed pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Lint the pages this pull request touches
        # Only the changed pages, so the check stays fast and every finding is about work in
        # this pull request rather than a backlog nobody here created.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF"...HEAD -- '*.md')
          FILES=$(echo "$CHANGED" | grep -vE '^[.]convai-docs/|^[.]cursor/|^[.]github/|^SUMMARY[.]md$|^AGENTS[.]md$|^CLAUDE[.]md$|^CODE_OF_CONDUCT[.]md$|^CONTRIBUTING[.]md$|^LICENSE[.]md$|^SECURITY[.]md$' || true)
          if [ -z "$FILES" ]; then
            echo "No documentation pages changed."
            exit 0
          fi
          echo "$FILES"
          python .convai-docs/rules/tools/check_page.py $FILES --summary SUMMARY.md

  site:
    name: Whole site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check links, orphans, and duplicate metadata
        # Baselined: findings that already existed when this check was adopted live in
        # .convai-docs/site-baseline.json and do not fail the build. Only new ones do.
        # Work the baseline down; never regenerate it to turn a red run green.
        run: python .convai-docs/rules/tools/check_site.py . --baseline .convai-docs/site-baseline.json
